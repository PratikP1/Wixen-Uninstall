name: Release

# Publishing is driven by tags: push `v0.1.0` and this builds the installer,
# checksums it, and attaches it to a GitHub Release.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships an installer whose filename
      # and Add/Remove Programs entry contradict the release notes.
      - name: Check the tag matches the package version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          package_version="$(
            sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1
          )"
          if [ "$tag" != "v$package_version" ]; then
            echo "Tag $tag does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          echo "Releasing version $package_version"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (host target)
        run: cargo clippy --locked --all-targets --features test-utils -- -D warnings

      - name: Clippy (Windows target)
        run: >-
          cargo clippy --locked --all-targets --features test-utils
          --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run test suite
        run: cargo test --locked --features test-utils

  publish:
    name: Build and publish the installer
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --locked --features test-utils

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "Unable to read version from Cargo.toml"
          }

          $version = $versionLine.Matches[0].Groups[1].Value
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.2.2 --no-progress -y

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify the binary requests Administrator
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\release\wixen_uninstall.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text -notmatch 'requireAdministrator') {
            throw "$exe has no requireAdministrator manifest; it would run unelevated"
          }
          Write-Host 'Elevation manifest verified.'

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "ISCC.exe not found at $compiler"
          }

          & $compiler `
            "/DAppVersion=${{ steps.package.outputs.version }}" `
            '/DBinaryDir=target\x86_64-pc-windows-msvc\release' `
            '/DOutputDir=installer_output' `
            'wixen_uninstall.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

      # Wixen is unsigned, so a checksum is the only way a downloader can tell
      # our installer apart from a tampered copy.
      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'installer_output\WixenUninstaller-Setup-*.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No installer was produced'
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" |
            Set-Content -Path "installer_output\$($installer.Name).sha256" -NoNewline
          Write-Host "SHA256 $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $tag = 'v' + $version
          $notes = 'docs/release-notes.md'
          $arguments = @(
            'release', 'create', $tag,
            'installer_output\WixenUninstaller-Setup-*.exe',
            'installer_output\WixenUninstaller-Setup-*.exe.sha256',
            '--title', "Wixen Uninstaller $version",
            '--verify-tag'
          )

          if (Test-Path $notes) {
            $arguments += @('--notes-file', $notes)
          } else {
            $arguments += '--generate-notes'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
