name: Release

# Publishing is driven by tags: push `v0.4.0` and this builds the installer,
# checksums it, and attaches it to a GitHub Release.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships an installer whose filename
      # and Add/Remove Programs entry contradict the release notes.
      - name: Check the tag matches the package version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          package_version="$(
            sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1
          )"
          if [ "$tag" != "v$package_version" ]; then
            echo "Tag $tag does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          echo "Releasing version $package_version"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (host target)
        run: cargo clippy --locked --all-targets --features test-utils -- -D warnings

      - name: Clippy (Windows target)
        run: >-
          cargo clippy --locked --all-targets --features test-utils
          --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run test suite
        run: cargo test --locked --features test-utils

  publish:
    name: Build and publish the installer
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --locked --features test-utils

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "Unable to read version from Cargo.toml"
          }

          $version = $versionLine.Matches[0].Groups[1].Value
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      # The windows-latest image already ships Inno Setup 6, and Chocolatey
      # refuses to downgrade to a pinned older version, so use what is there and
      # only install when the image drops it.
      - name: Ensure Inno Setup is available
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "choco install innosetup failed with exit code $LASTEXITCODE"
            }
            $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $compiler) {
            throw "ISCC.exe not found after install. Looked in: $($candidates -join ', ')"
          }

          # Read the version through PowerShell rather than `ISCC /?`, which
          # exits non-zero and would fail the step.
          $version = (Get-Item $compiler).VersionInfo.ProductVersion
          Write-Host "Using Inno Setup $version at $compiler"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "compiler=$compiler"

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify the embedded manifest
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\release\wixen_uninstall.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)

          # Without this the Start-menu shortcut runs unelevated and every
          # removal action fails with "Access is denied".
          if ($text -notmatch 'requireAdministrator') {
            throw "$exe has no requireAdministrator manifest; it would run unelevated"
          }
          # Without this TaskDialogIndirect does not exist and the process
          # cannot even start: System32's comctl32 is still version 5.
          if ($text -notmatch 'Microsoft\.Windows\.Common-Controls') {
            throw "$exe is missing the comctl32 v6 dependency; task dialogs would not load"
          }
          if ($text -notmatch 'longPathAware') {
            throw "$exe is missing the longPathAware manifest setting"
          }
          Write-Host 'Manifest verified: elevation, common controls v6, long paths.'

      # Proves the manifest actually resolves at run time: the process has to
      # load comctl32 v6 and put its first task dialog on screen. A missing or
      # malformed dependency shows up here as an immediate exit.
      - name: Smoke-test the built application
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\release\wixen_uninstall.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            throw "$exe exited immediately with code $($process.ExitCode); " +
                  "the side-by-side manifest or a dialog call is broken"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host 'Application started and displayed its first dialog.'

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = '${{ steps.inno.outputs.compiler }}'

          & $compiler `
            "/DAppVersion=${{ steps.package.outputs.version }}" `
            '/DBinaryDir=target\x86_64-pc-windows-msvc\release' `
            '/DOutputDir=installer_output' `
            'wixen_uninstall.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

      # Wixen is unsigned, so a checksum is the only way a downloader can tell
      # our installer apart from a tampered copy.
      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'installer_output\WixenUninstaller-Setup-*.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No installer was produced'
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" |
            Set-Content -Path "installer_output\$($installer.Name).sha256" -NoNewline
          Write-Host "SHA256 $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $tag = 'v' + $version
          $notes = 'docs/release-notes.md'
          $arguments = @(
            'release', 'create', $tag,
            'installer_output\WixenUninstaller-Setup-*.exe',
            'installer_output\WixenUninstaller-Setup-*.exe.sha256',
            '--title', "Wixen Uninstaller $version",
            '--verify-tag'
          )

          if (Test-Path $notes) {
            $arguments += @('--notes-file', $notes)
          } else {
            $arguments += '--generate-notes'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
