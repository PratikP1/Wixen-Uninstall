[package]
name = "wixen_uninstall_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The package is `wixen_uninstall`; its lib target is `wixen_uninstall_lib`,
# which is the name the fuzz targets import.
wixen_uninstall = { path = ".." }

[[bin]]
name = "fuzz_parse_input"
path = "fuzz_targets/fuzz_parse_input.rs"
test = false
doc = false

[[bin]]
name = "fuzz_from_slug"
path = "fuzz_targets/fuzz_from_slug.rs"
test = false
doc = false

[[bin]]
name = "fuzz_from_menu_index"
path = "fuzz_targets/fuzz_from_menu_index.rs"
test = false
doc = false

[[bin]]
name = "fuzz_resolve_path"
path = "fuzz_targets/fuzz_resolve_path.rs"
test = false
doc = false
