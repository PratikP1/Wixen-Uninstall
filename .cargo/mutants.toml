# cargo-mutants configuration
# Author: PratikP1
#
# The path matters: cargo-mutants only reads `.cargo/mutants.toml`.
#
# Run mutation testing with:
#   cargo mutants
#
# cargo-mutants docs: https://mutants.rs

# Build with the test-utils feature so StubExecutor is available to the
# integration tests, which is where most mutants are caught.
features = ["test-utils"]

# Skip the Windows-only modules. They are compiled out on Linux, so no test can
# execute a mutant inside them and every one would be reported as missed.
# cargo-mutants names mutants by their innermost module path, so one pattern
# covers executor::windows, ui::windows, and elevation::windows.
exclude_re = [
    "windows::",
    # `is_elevated` returns a literal `true` off Windows, so its mutant is
    # equivalent code that no Linux test can distinguish.
    "is_elevated",
    # `show_error` only runs when `is_elevated` says no, which off Windows it
    # never does, so no Linux test can reach it.
    "show_error",
    # `show_restart_scheduled` only runs after a removal has deferred files to a
    # reboot, which off Windows the no-op `LiveExecutor` never does, so no Linux
    # test can reach it. Its wording is pinned by the `restart_notice` tests.
    "show_restart_scheduled",
    # `arrange_resume` and `take_pending_resume` are the reboot-persistence
    # dispatch. Off Windows both are no-op stubs (write nothing, read nothing),
    # so a Linux mutant either duplicates the stub (equivalent) or changes an
    # effect no test can observe. The RunOnce and state-file I/O they wrap is
    # Windows-only; the pure parts (`state_file_path`, `relaunch_command`,
    # `is_resume_request`, `ResumeState::parse`) are tested and stay in scope.
    "arrange_resume",
    "take_pending_resume",
    # `LiveVendorUninstaller::read_uninstall_string` shells out to reg.exe on
    # Windows and returns `None` off it; a Linux mutant's value is swallowed by
    # the equally-stubbed `run`, so no test can distinguish it. The pure parser
    # it feeds, `parse_reg_query_value`, is tested directly and stays in scope,
    # as do the scripted double's own methods; only the Live reader is excluded.
    "LiveVendorUninstaller>::read_uninstall_string",
    # The `--resume` entry point's whole-body replacement with
    # `Ok(Default::default())`. `ExitCode: Default` exists only on newer
    # toolchains, so this one mutant is *viable and surviving* on some rustc
    # versions but *unviable* on others (CI's 1.97.1 rejects it). Left to the
    # baseline it makes the gate's outcome depend on the compiler version;
    # excluding just this replacement keeps the gate deterministic across the
    # matrix. The `delete !` elevation-guard mutant on the same function stays in
    # scope and is caught by `resume_mode_with_nothing_pending_exits_quietly`.
    "resume_suspended_removal -> io::Result<ExitCode> with Ok\\(Default",
    # `execute_headless`'s whole-body replacement, the same toolchain-fragile
    # `ExitCode: Default` mutant as the resume entry above: viable-and-surviving
    # on a newer rustc, unviable on CI's, so excluding it keeps the gate
    # deterministic. Its `delete !` elevation guard stays in scope and is caught
    # by `execute_mode_with_a_product_exits_quietly` in cli.rs.
    "execute_headless -> io::Result<ExitCode> with Ok\\(Default",
    # `run_and_write_results` composes the tested `write_results_for` with the one
    # fixed `%ProgramData%` path. Its whole-body `Ok(())` mutant skips a write
    # whose logic `writing_results_leaves_a_readable_report` pins at a caller-
    # chosen path; the fixed path itself cannot be exercised parallel-safely (a
    # shared file that cargo-mutants `--jobs` would race on), and the derivation
    # (`results_file_path`, `program_data`) is tested on its own.
    "run_and_write_results",
    # `run_execution_as_system` is the SYSTEM-relaunch entry point: the `schtasks`
    # create/run/await/delete dance, compiled only on Windows and never reachable
    # on Linux, so its mutants are missed there. The command-line contract
    # (`parse_execute_request`, `task_run_command`), the results path, and the
    # report serialization it depends on are all tested; only this Windows I/O
    # orchestration is excluded, matching `arrange_resume`/`take_pending_resume`.
    "run_execution_as_system",
    # `run_removal_via_system`'s non-Windows arm is literally `Ok(None)` (the
    # in-process fallback), so the whole-body mutant that returns `Ok(None)` is an
    # identical program on Linux. Its Windows arm delegates to the untestable
    # `ui::windows` module. `main`'s use of the result (SYSTEM path vs fallback)
    # is covered by the cli tests, which take the `None` path off Windows.
    "run_removal_via_system",
    # The helpers in `ui/task_dialog.rs` that actually call into comctl32.
    # Everything else in that file (the builder, the flag maths, the struct
    # layout, the UTF-16 conversion) is portable and stays in scope.
    "Dialog::show",
    "invoke",
    "set_help_handler",
    "show_progress",
    "update_progress",
    "\\bsend\\b",
]

# `ui/windows.rs` is the only file left out: it is pure Win32 drawing, compiled
# out on Linux, and what it *says* is decided by the tested functions in
# `ui.rs`. `main.rs` and `ui/task_dialog.rs` are both covered: `main` through
# `tests/cli.rs`, which drives the real binary over a pipe.
exclude_globs = ["src/ui/windows.rs"]
