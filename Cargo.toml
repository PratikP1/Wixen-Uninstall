[package]
name = "wixen_uninstall"
version = "0.1.0"
edition = "2024"
# Let-chains (`if let … && let …`) are stable from 1.88 in the 2024 edition.
rust-version = "1.88"
authors = ["PratikP1"]
description = "A user-friendly, accessible uninstaller for stubborn consumer security suites"
repository = "https://github.com/PratikP1/Wixen-Uninstall"
readme = "README.md"
keywords = ["uninstaller", "antivirus", "windows", "accessibility"]
categories = ["command-line-utilities"]
license = "MIT"
# Embeds the Windows manifest that makes the app request Administrator.
build = "build.rs"

[[bin]]
name = "wixen_uninstall"
path = "src/main.rs"

[lib]
name = "wixen_uninstall_lib"
path = "src/lib.rs"

[dependencies]
# No runtime dependencies — the library core is pure Rust.
# The Windows-specific uninstall calls are gated behind #[cfg(target_os = "windows")].

[dev-dependencies]
# mutation testing: cargo install cargo-mutants
# fuzz testing:    cargo install cargo-fuzz  (requires nightly)

[features]
# Exposes StubExecutor for integration tests and external test crates.
test-utils = []

[profile.test]
opt-level = 0

[profile.release]
# A single self-contained executable that users download over the internet:
# smaller is friendlier, and there is nothing to debug in the shipped binary.
lto = true
codegen-units = 1
strip = "symbols"

# Requires `--features test-utils`; `cargo test` alone skips this target, so CI
# and the README always pass the feature explicitly.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-utils"]
